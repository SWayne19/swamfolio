<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swam Pyae Paing · Full Stack Developer</title>
    <meta name="description" content="Swam Pyae Paing is a full stack developer in Yangon building fast, reliable web applications with Vue and Laravel." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (e) {}
        // Dark by default; light only when explicitly chosen.
        document.documentElement.classList.toggle('dark', saved !== 'light');
      })();
    </script>
    <style>html { background-color: #0b0b0b; } html:not(.dark) { background-color: #f2f2ef; }</style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
